name: manifest-policy-finalizer

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'v1.0.1-manifest-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v1.0.1-manifest-policy
          fetch-depth: 0
      - name: Regenerate scoped manifest and validate
        run: |
          set -euo pipefail
          rm .github/workflows/manifest-policy-finalizer.yml
          python scripts/regenerate_manifest.py
          python scripts/verify_manifest.py
          python scripts/check_release.py
          python scripts/verify_all.py --quick --jobs 2
      - name: Commit finalized branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finalize scoped manifest policy'
          git push origin HEAD:v1.0.1-manifest-policy
