name: v1.0.1-release-operator

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v1.0.1-release-operator.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v1.0.1-release-operator
  cancel-in-progress: false

env:
  TAG: v1.0.1
  VERSION_VALUE: 1.0.1
  RELEASE_DATE: 2026-07-30
  STAGING_BRANCH: v1.0.1-release-staging
  ASSET_NAME: square-riesz-polarization-certificates-v1.0.1.zip
  PREFIX: square-riesz-polarization-certificates-v1.0.1
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Preflight
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION_VALUE"
          grep -q 'version: "1.0.1"' CITATION.cff
          grep -q 'date-released: "2026-07-30"' CITATION.cff
          grep -q '/releases/tag/v1.0.1' CITATION.cff
          test -f RELEASE_NOTES_v1.0.1.md
          test -f MANIFEST_POLICY.json
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG Release already exists"
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${STAGING_BRANCH}" >/dev/null 2>&1 || true

      - name: Verify scoped manifest and Release structure
        run: |
          set -euo pipefail
          python scripts/regenerate_manifest.py
          python scripts/verify_manifest.py
          python scripts/check_release.py

      - name: Full 88-verifier replay
        run: |
          set -euo pipefail
          replay_dir="$RUNNER_TEMP/v1.0.1-full-replay"
          python scripts/verify_all.py --all --jobs 2 --output-dir "$replay_dir"
          python - "$replay_dir/summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          assert summary["verifier_count"] == 88, summary
          assert summary["certified_count"] == 88, summary
          assert all(item["certified"] for item in summary["results"]), summary
          print("full_replay=88/88_CERTIFIED")
          PY

      - name: Finalize release tree locally
        id: finalize
        run: |
          set -euo pipefail
          replay_summary="$RUNNER_TEMP/v1.0.1-full-replay/summary.json"
          git rm .github/workflows/v1.0.1-release-operator.yml
          python - "$replay_summary" <<'PY'
          import json, pathlib, re, subprocess, sys
          root = pathlib.Path.cwd()
          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          paths = [p for p in paths if p and p not in {"PUBLICATION_AUDIT.json", "SHA256SUMS"}]
          findings = []
          patterns = {
              "private_key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "github_token": re.compile(r"\b(?:ghp|github_pat)_[A-Za-z0-9_]{20,}\b"),
              "openai_key": re.compile(r"\bsk-(?:proj-)?[A-Za-z0-9_-]{20,}\b"),
              "local_container_path": re.compile(r"/mnt/data/"),
              "mac_user_path": re.compile(r"/Users/[^/\s]+/"),
              "unrelated_notebook": re.compile(r"P02_AIAGENTSEC_M3_HOSTED_SAFE_SINGLE_POST_BASELINE_v09\.ipynb"),
              "private_mailbox": re.compile(r"(?:erichfriedman68|sts0516k)@gmail\.com", re.I),
          }
          for relative in paths:
              candidate = root / relative
              try:
                  text = candidate.read_text(encoding="utf-8")
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              for name, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append({"path": relative, "pattern": name})
          readme = (root / "README.md").read_text(encoding="utf-8")
          if "Driedsandwich supervised the research" not in readme:
              findings.append({"path": "README.md", "pattern": "public_attribution_boundary"})
          if findings:
              print(json.dumps(findings, indent=2))
              raise SystemExit("privacy or secret scan failed")
          audit = {
              "release_version": "1.0.1",
              "audit_run_id": "${{ github.run_id }}",
              "files_scanned": len(paths),
              "patterns_checked": sorted(patterns) + ["public_attribution_boundary"],
              "findings": [],
              "internal_manifest": {
                  "policy": "MANIFEST_POLICY.json",
                  "entry_count": sum(1 for line in (root / "SHA256SUMS").read_text().splitlines() if line.strip()),
              },
              "full_release_replay": {
                  "verifiers": summary["verifier_count"],
                  "certified": summary["certified_count"],
                  "failed": summary["verifier_count"] - summary["certified_count"],
              },
              "mathematical_changes_from_v1.0.0": False,
              "status": "PASS",
              "repository_url": "https://github.com/Driedsandwich/square-riesz-polarization-certificates",
              "release_url": "https://github.com/Driedsandwich/square-riesz-polarization-certificates/releases/tag/v1.0.1",
              "excluded_from_internal_manifest": ["PUBLICATION_AUDIT.json", "SHA256SUMS", "human-facing documentation", "GitHub automation"],
          }
          (root / "PUBLICATION_AUDIT.json").write_text(json.dumps(audit, indent=2) + "\n", encoding="utf-8")
          record = f"""# GitHub release operator record — v1.0.1

## Mathematical boundary

- Fixed configurations changed from v1.0.0: **no**
- Certified lower bounds changed from v1.0.0: **no**
- Exact certifier algorithms changed from v1.0.0: **no**
- Fresh publication replay: **{summary['certified_count']}/{summary['verifier_count']} CERTIFIED**

## Completed pre-publication checks

- [x] Scoped manifest regenerated and verified.
- [x] Release structure check passed.
- [x] All 88 exact certifiers passed in fresh processes.
- [x] Privacy and secret scan reported zero findings.
- [x] README public-attribution boundary preserved.
- [x] v1.0.0 tag, Release, and existing assets were not modified.

## Publication mechanism

The canonical deterministic ZIP is generated from the final tagged commit. A draft Release receives the ZIP and checksum companion before publication. After draft-asset verification, the Release is published and checked for immutable status.

Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
"""
          (root / "docs" / "release-record-v1.0.1.md").write_text(record, encoding="utf-8")
          PY
          python scripts/regenerate_manifest.py
          python scripts/verify_manifest.py
          python scripts/check_release.py
          python scripts/verify_all.py --quick --jobs 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/v1.0.1-release-operator.yml PUBLICATION_AUDIT.json docs/release-record-v1.0.1.md SHA256SUMS
          git commit -m 'release: finalize v1.0.1 state'
          final_sha="$(git rev-parse HEAD)"
          base_remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$(git rev-parse HEAD^)" = "$base_remote"
          git push origin "$final_sha:refs/heads/$STAGING_BRANCH"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Build and verify deterministic assets
        id: assets
        run: |
          set -euo pipefail
          final_sha='${{ steps.finalize.outputs.final_sha }}'
          asset="$RUNNER_TEMP/$ASSET_NAME"
          checksum="$RUNNER_TEMP/${ASSET_NAME}.sha256"
          git archive --format=zip --prefix="$PREFIX/" --output="$asset" "$final_sha"
          zip_sha="$(sha256sum "$asset" | awk '{print $1}')"
          printf '%s  %s\n' "$zip_sha" "$ASSET_NAME" > "$checksum"
          unzip -t "$asset" >/dev/null
          extract_dir="$RUNNER_TEMP/extracted"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          unzip -q "$asset" -d "$extract_dir"
          cd "$extract_dir/$PREFIX"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION_VALUE"
          test ! -e .github/workflows/v1.0.1-release-operator.yml
          grep -q 'Driedsandwich supervised the research' README.md
          python scripts/verify_manifest.py
          python scripts/check_release.py
          python scripts/verify_all.py --quick --jobs 2
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "zip_sha=$zip_sha" >> "$GITHUB_OUTPUT"
          echo "zip_size=$(wc -c < "$asset" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Create and verify draft Release
        run: |
          set -euo pipefail
          final_sha='${{ steps.finalize.outputs.final_sha }}'
          asset='${{ steps.assets.outputs.asset }}'
          checksum='${{ steps.assets.outputs.checksum }}'
          gh release create "$TAG" \
            "$asset#Canonical deterministic source and certificate corpus" \
            "$checksum#SHA-256 checksum for the canonical ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$final_sha" \
            --title 'v1.0.1 — Documentation and reproducibility hardening' \
            --notes-file RELEASE_NOTES_v1.0.1.md \
            --draft
          draft_json="$RUNNER_TEMP/draft-release.json"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,targetCommitish,assets,url > "$draft_json"
          test "$(jq -r '.tagName' "$draft_json")" = "$TAG"
          test "$(jq -r '.isDraft' "$draft_json")" = 'true'
          test "$(jq -r '.isPrerelease' "$draft_json")" = 'false'
          test "$(jq '.assets | length' "$draft_json")" = '2'
          verify_dir="$RUNNER_TEMP/draft-download"
          mkdir -p "$verify_dir"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          cd "$verify_dir"
          test -f "$ASSET_NAME"
          test -f "${ASSET_NAME}.sha256"
          sha256sum -c "${ASSET_NAME}.sha256"
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = '2'

      - name: Publish immutable Release and verify
        id: publish
        run: |
          set -euo pipefail
          final_sha='${{ steps.finalize.outputs.final_sha }}'
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          published_json="$RUNNER_TEMP/published-release.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$published_json"
          if [ "$(jq -r '.immutable // false' "$published_json")" != 'true' ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${STAGING_BRANCH}" >/dev/null 2>&1 || true
            echo '::error::Release immutability is not enabled. Enable it in repository Settings > General > Releases, then rerun this workflow.'
            exit 1
          fi
          test "$(jq -r '.draft' "$published_json")" = 'false'
          test "$(jq -r '.prerelease' "$published_json")" = 'false'
          test "$(jq '.assets | length' "$published_json")" = '2'
          tag_sha="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          test "$tag_sha" = "$final_sha"
          verify_dir="$RUNNER_TEMP/published-download"
          mkdir -p "$verify_dir"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          cd "$verify_dir"
          sha256sum -c "${ASSET_NAME}.sha256"
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = '2'
          echo "release_url=$(jq -r '.html_url' "$published_json")" >> "$GITHUB_OUTPUT"

      - name: Advance main and remove staging branch
        run: |
          set -euo pipefail
          final_sha='${{ steps.finalize.outputs.final_sha }}'
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$(git rev-parse "$final_sha^")" = "$current_main"
          git push origin "$final_sha:refs/heads/main"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$final_sha"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${STAGING_BRANCH}"

      - name: Upload fresh full-replay logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v1.0.1-full-replay-logs
          path: ${{ runner.temp }}/v1.0.1-full-replay
          if-no-files-found: error
          retention-days: 90

      - name: Publication summary
        if: success()
        run: |
          {
            echo '## v1.0.1 publication result'
            echo "- final main/tag: ${{ steps.finalize.outputs.final_sha }}"
            echo "- canonical ZIP SHA-256: ${{ steps.assets.outputs.zip_sha }}"
            echo "- canonical ZIP size: ${{ steps.assets.outputs.zip_size }} bytes"
            echo "- Release: ${{ steps.publish.outputs.release_url }}"
            echo '- immutable: true'
            echo '- assets: 2/2 verified after re-download'
            echo '- full replay: 88/88 CERTIFIED'
          } >> "$GITHUB_STEP_SUMMARY"
