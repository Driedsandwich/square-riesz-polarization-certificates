name: audit-remediation-controller

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audit-remediation-controller
  cancel-in-progress: false

jobs:
  finalize-branch-and-clean-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit-remediation-v1
          fetch-depth: 0
      - name: Finalize and validate remediation branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/audit-remediation-finalize.yml
          find . -type f ! -path './.git/*' ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS
          test "$(wc -l < SHA256SUMS | tr -d ' ')" = "571"
          python scripts/verify_manifest.py
          python scripts/check_release.py
          python scripts/verify_all.py --quick --jobs 2
          python - <<'PY'
          from pathlib import Path
          import json
          for p in Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('json_parse=PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finalize post-publication audit remediation'
          git push origin HEAD:audit-remediation-v1
      - name: Remove one-shot controller from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          git rm .github/workflows/audit-remediation-controller.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove one-shot audit remediation controller'
          git push origin HEAD:main
