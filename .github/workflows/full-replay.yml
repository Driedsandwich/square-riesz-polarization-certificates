name: full-certificate-replay

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

jobs:
  verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/verify_manifest.py
      - run: python scripts/check_release.py
      - run: python scripts/verify_all.py --all --jobs 2 --output-dir ci-full-replay
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-replay-logs
          path: ci-full-replay
          if-no-files-found: error
          retention-days: 30
