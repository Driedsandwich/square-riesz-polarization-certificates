name: scope-boundary-finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'document-scope-boundary-n52'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: document-scope-boundary-n52
          fetch-depth: 0
      - name: Regenerate manifest and validate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/scope-boundary-finalizer.yml
          python - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.')
          excluded = {'SHA256SUMS', 'PUBLICATION_AUDIT.json'}
          lines = []
          for path in sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts):
              rel = path.as_posix()
              if rel in excluded:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f'{digest}  {rel}')
          Path('SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python scripts/verify_manifest.py
          python scripts/check_release.py
          python scripts/verify_all.py --quick --jobs 2
      - name: Commit finalized branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md SHA256SUMS .github/workflows/scope-boundary-finalizer.yml
          git commit -m 'chore: finalize scope-boundary documentation'
          git push origin HEAD:document-scope-boundary-n52
