name: v1.0.1-release-publisher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v1.0.1-release-publisher.yml
      - .github/release/v1.0.1-publish.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v1.0.1-release-publisher
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Publish verified immutable v1.0.1
        run: bash .github/release/v1.0.1-publish.sh

      - name: Upload fresh full-replay logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v1.0.1-full-replay-logs
          path: ${{ runner.temp }}/v1.0.1-full-replay
          if-no-files-found: warn
          retention-days: 90
