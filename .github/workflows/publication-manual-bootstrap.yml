name: publication-manual-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-bootstrap
  cancel-in-progress: false

env:
  EXPECTED_ARCHIVE_SHA256: 9a50a8e2d2c218b7f4c1f3cdba5ecfddf11bca6363f7c84f3c7fc36da7602331
  EXPECTED_FILE_COUNT: '564'

jobs:
  publish-canonical-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private staging state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .publication-trigger
          mapfile -t parts < <(find .publication-payload -maxdepth 1 -type f -name 'part.*' | sort)
          test "${#parts[@]}" = '11'

          candidate_b64="$RUNNER_TEMP/repo.tar.xz.b64"
          archive="$RUNNER_TEMP/repo.tar.xz"
          selected=''

          try_candidate() {
            local label="$1"
            shift
            : > "$candidate_b64"
            local f
            for f in "$@"; do
              tr -d '\r\n\t ' < "$f" >> "$candidate_b64"
            done
            if base64 -d "$candidate_b64" > "$archive" 2>/dev/null; then
              local actual
              actual="$(sha256sum "$archive" | awk '{print $1}')"
              echo "candidate=${label} archive_sha256=${actual}"
              if [ "$actual" = "$EXPECTED_ARCHIVE_SHA256" ]; then
                selected="$label"
                return 0
              fi
            else
              echo "candidate=${label} base64_decode=FAIL"
            fi
            return 1
          }

          try_candidate all "${parts[@]}" || true

          if [ -z "$selected" ]; then
            for omit in "${!parts[@]}"; do
              subset=()
              for i in "${!parts[@]}"; do
                if [ "$i" != "$omit" ]; then
                  subset+=("${parts[$i]}")
                fi
              done
              try_candidate "omit-$(basename "${parts[$omit]}")" "${subset[@]}" && break || true
            done
          fi

          test -n "$selected"
          echo "selected_payload=${selected}"
          echo "${EXPECTED_ARCHIVE_SHA256}  $archive" | sha256sum -c -

          mkdir -p "$RUNNER_TEMP/finalized-repo"
          tar -xJf "$archive" -C "$RUNNER_TEMP/finalized-repo"
          actual_count="$(find "$RUNNER_TEMP/finalized-repo" -type f | wc -l | tr -d ' ')"
          test "$actual_count" = "$EXPECTED_FILE_COUNT"

      - name: Verify finalized repository before commit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/finalized-repo"
          python3 scripts/verify_manifest.py
          python3 scripts/check_release.py
          test ! -e operator
          test ! -e .publication-payload
          test ! -e .publication-trigger
          test ! -e .github/workflows/publication-bootstrap.yml
          test ! -e .github/workflows/publication-label-bootstrap.yml
          test ! -e .github/workflows/publication-create-bootstrap.yml
          test ! -e .github/workflows/publication-manual-bootstrap.yml

      - name: Replace bootstrap tree and push one canonical commit
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/finalized-repo/." .
          actual_count="$(find . -type f ! -path './.git/*' | wc -l | tr -d ' ')"
          test "$actual_count" = "$EXPECTED_FILE_COUNT"
          python3 scripts/verify_manifest.py
          python3 scripts/check_release.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: publish v1.0.0 certified lower-bound corpus'
          git push origin HEAD:main
          git push origin --delete publication-bootstrap-trigger || true
