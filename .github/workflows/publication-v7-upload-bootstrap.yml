name: publication-v7-upload-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-bootstrap
  cancel-in-progress: false

env:
  PAYLOAD_PATH: .publication-payload-v7/square-riesz-polarization-certificates-v1.0.0.zip
  EXPECTED_ZIP_SHA256: 3efed92c6227594f04374b6b3d795c1c8f5d0fc6942734678559e93c9220351b
  EXPECTED_FILE_COUNT: '564'
  EXPECTED_NONWORKFLOW_FILE_COUNT: '562'

jobs:
  publish-canonical-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private staging state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and extract uploaded canonical ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PAYLOAD_PATH"
          echo "${EXPECTED_ZIP_SHA256}  ${PAYLOAD_PATH}" | sha256sum -c -
          unzip -t "$PAYLOAD_PATH"
          mkdir -p "$RUNNER_TEMP/extracted"
          unzip -q "$PAYLOAD_PATH" -d "$RUNNER_TEMP/extracted"
          repo_root="$RUNNER_TEMP/extracted/square-riesz-polarization-certificates-v1.0.0"
          test -d "$repo_root"
          actual_count="$(find "$repo_root" -type f | wc -l | tr -d ' ')"
          test "$actual_count" = "$EXPECTED_FILE_COUNT"
          echo "REPO_ROOT=$repo_root" >> "$GITHUB_ENV"

      - name: Verify canonical repository before commit
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO_ROOT"
          python3 scripts/verify_manifest.py
          python3 scripts/check_release.py
          test ! -e operator
          test ! -e .publication-payload
          test ! -e .publication-payload-v4
          test ! -e .publication-payload-v7
          test ! -e .publication-trigger

      - name: Replace only non-workflow content and push
        shell: bash
        run: |
          set -euo pipefail
          workflow_backup="$RUNNER_TEMP/current-workflows"
          mkdir -p "$workflow_backup"
          if [ -d .github/workflows ]; then
            cp -a .github/workflows/. "$workflow_backup/"
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$REPO_ROOT/." .

          rm -rf .github/workflows
          mkdir -p .github/workflows
          if find "$workflow_backup" -mindepth 1 -print -quit | grep -q .; then
            cp -a "$workflow_backup/." .github/workflows/
          fi

          nonworkflow_count="$(find . -type f ! -path './.git/*' ! -path './.github/workflows/*' | wc -l | tr -d ' ')"
          test "$nonworkflow_count" = "$EXPECTED_NONWORKFLOW_FILE_COUNT"
          awk '$2 !~ /^\.github\/workflows\//' SHA256SUMS | sha256sum -c -
          python3 scripts/check_release.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if ! git diff --cached --quiet -- .github/workflows; then
            echo 'ERROR: workflow files would change in this commit'
            git diff --cached --name-status -- .github/workflows
            exit 1
          fi

          git commit -m 'release: publish v1.0.0 certified lower-bound corpus'
          git push origin HEAD:main
